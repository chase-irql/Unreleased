<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Vite builds with base './' so the Electron build can find its assets
         over file://. On the web that relative base is resolved against the
         current path, which breaks every nested route: from
         /auth/discord/callback the browser asks for
         /auth/discord/assets/index-*.js, gets a 404, and renders nothing —
         a blank page right after Discord login (same for /shared/<id>).
         Over http(s) repoint the base at the origin root before the parser
         reaches the injected module script; file:// keeps the relative base. -->
    <base href="./" />
    <script>if(/^https?:/.test(location.protocol))document.querySelector('base').href='/'</script>
    <!-- maximum-scale=1 stops iOS Safari's auto-zoom when focusing inputs
         under 16px (all our text-xs fields); deliberate pinch-zoom still
         works — iOS ignores the cap for user gestures. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- PWA / installability. These are inert in the Electron build (it loads
         over file://, never installs, and the service worker is not registered
         there — see main.tsx). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#121212" />
    <!-- iOS ignores the web manifest for "Add to Home Screen" — it reads these
         Apple-specific tags instead to launch fullscreen with our own icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Unreleased" />
    <link rel="apple-touch-icon" href="/icon-512.png" />

    <title>unreleased</title>
    <!-- Apply saved theme before React renders to prevent flash -->
    <script>
      try {
        const t = localStorage.getItem('wavelength-theme')
        if (t !== 'light') document.documentElement.classList.add('dark')
      } catch(_) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
