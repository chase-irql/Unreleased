<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 stops iOS Safari's auto-zoom when focusing inputs
         under 16px (all our text-xs fields); deliberate pinch-zoom still
         works — iOS ignores the cap for user gestures. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>unreleased</title>
    <!-- Apply saved theme before React renders to prevent flash -->
    <script>
      try {
        const t = localStorage.getItem('wavelength-theme')
        if (t !== 'light') document.documentElement.classList.add('dark')
      } catch(_) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
