<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Vite builds with base './'. The Capacitor webview serves dist/ from
         https://localhost, where that relative base resolves against the
         current path and breaks every nested route (from /shared/<id> the
         webview asks for /shared/assets/index-*.js and gets nothing). Over
         http(s) repoint the base at the origin root before the parser reaches
         the injected module script. -->
    <base href="./" />
    <script>if(/^https?:/.test(location.protocol))document.querySelector('base').href='/'</script>
    <!-- viewport-fit=cover runs the WebView edge-to-edge; App absorbs the
         status-bar inset with env(safe-area-inset-top). maximum-scale=1 stops
         auto-zoom when focusing inputs under 16px (all our text-xs fields);
         deliberate pinch-zoom still works. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#121212" />

    <title>unreleased — Juice WRLD music player</title>

    <!-- Apply saved theme before React renders to prevent flash -->
    <script>
      try {
        const t = localStorage.getItem('wavelength-theme')
        if (t !== 'light') document.documentElement.classList.add('dark')
      } catch(_) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
