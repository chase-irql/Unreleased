name: Build iOS release

# Mirrors build-android.yml: release_ios.py (not yet written) would publish an
# ios-v* GitHub release with no assets, and this fires on that publish to
# attach the .ipa. Also runnable manually via workflow_dispatch for testing
# before that release script exists.
#
# Produces an UNSIGNED .ipa — there's no Apple Developer account behind this
# build. Users install it via AltStore/Sideloadly, which re-signs it locally
# with their own free Apple ID on install. Don't add signing here without
# also deciding how a cert/provisioning profile gets into repo secrets.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. ios-v1.0.0)"
        required: true

jobs:
  ios:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'ios-v')
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Resolve tag
        id: tag
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#ios-v}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          # see build-android.yml — youtube-dl-exec's postinstall hits GitHub's
          # unauthenticated rate limit on shared runner IPs; app fetches its
          # own yt-dlp at runtime instead.
          YOUTUBE_DL_SKIP_DOWNLOAD: "1"
        run: npm ci

      - name: Build renderer
        env:
          VITE_LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          VITE_LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync ios

      - name: Archive unsigned .app
        working-directory: ios/App
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned .ipa
        run: |
          app="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          payload="$RUNNER_TEMP/Payload"
          mkdir -p "$payload"
          cp -R "$app" "$payload/"
          (cd "$RUNNER_TEMP" && zip -qr App.ipa Payload)
          mv "$RUNNER_TEMP/App.ipa" .

      - name: Upload IPA to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="Unreleased-ios-v${{ steps.tag.outputs.version }}.ipa"
          cp App.ipa "$asset"
          gh release upload "${{ steps.tag.outputs.tag }}" "$asset" \
            --clobber --repo "${{ github.repository }}"
