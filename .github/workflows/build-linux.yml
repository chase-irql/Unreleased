name: Build Linux release

# release.py just publishes the GitHub release (no assets — see
# build-windows.yml, which covers why). AppImages can't be cross-built from
# Windows anyway, so this workflow fires on that publish, builds the Linux
# side on a Linux runner, and attaches the artifacts to the same release.
#
# latest-linux.yml is what electron-updater's AppImageUpdater reads to find
# updates — without it, Linux clients log an update error on every launch.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.14.2)"
        required: true

jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        env:
          VITE_LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          VITE_LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: npm run build

      - name: Package AppImage
        run: npx electron-builder --linux --publish never

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            release/*.AppImage release/latest-linux.yml \
            --clobber --repo "${{ github.repository }}"
