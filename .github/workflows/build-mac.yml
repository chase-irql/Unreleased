name: Build macOS release

# release.py just publishes the GitHub release (no assets — see
# build-windows.yml, which covers why). DMGs can't be built from Windows (mac
# packaging needs hdiutil) anyway, so this workflow fires on that publish,
# builds the mac side on a macOS runner, and attaches the artifacts to the
# same release.
#
# Unsigned/not notarized: no Apple Developer account yet, so the app isn't
# code-signed. Users will need to right-click -> Open (or run
# `xattr -cr /Applications/Unreleased.app`) on first launch to get past
# Gatekeeper. CSC_IDENTITY_AUTO_DISCOVERY=false stops electron-builder from
# trying to ad-hoc sign with whatever keychain identity happens to exist on
# the runner.
#
# latest-mac.yml is what electron-updater's MacUpdater reads to find
# updates — without it, mac clients log an update error on every launch.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.14.2)"
        required: true

jobs:
  mac:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          # youtube-dl-exec's postinstall downloads a yt-dlp binary from
          # GitHub releases — unauthenticated, so it hits the rate limit on
          # shared runner IPs (broke this build 2026-08-17). It's a
          # devDependency only for local-dev convenience; the app fetches
          # its own yt-dlp on demand at runtime, so skip it in CI.
          YOUTUBE_DL_SKIP_DOWNLOAD: "1"
        run: npm ci

      - name: Build renderer
        env:
          VITE_LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          VITE_LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: npm run build

      - name: Package DMG
        run: npx electron-builder --mac --publish never

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            release/*.dmg release/latest-mac.yml \
            --clobber --repo "${{ github.repository }}"
